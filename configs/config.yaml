# Project Configuration for Generative AI Restoration Studio

project:
  name: "genai-restoration-studio"
  seed: 42
  image_size: 128
  channels: 3

# Paths (Local & Colab paths)
paths:
  local:
    data_dir: "data"
    manifest_dir: "configs/manifests"
    models_dir: "models"
    checkpoints_dir: "checkpoints"
    mlruns_dir: "mlruns"
  colab:
    drive_root: "/content/drive/MyDrive/GenAI-A1"
    raw_oxford: "/content/drive/MyDrive/GenAI-A1/raw/OxfordPet"
    raw_fs2k: "/content/drive/MyDrive/GenAI-A1/raw/FS2K"
    checkpoints_dir: "/content/drive/MyDrive/GenAI-A1/checkpoints"
    mlruns_dir: "/content/drive/MyDrive/GenAI-A1/mlruns"
    manifest_dir: "/content/drive/MyDrive/GenAI-A1/manifests"

# Dataset Split Configurations
datasets:
  oxford_pet:
    train_val_split_ratio: 0.8  # 80% train, 20% val from official trainval
    split_seed: 42
    target_size: [128, 128]
    raw_urls:
      images: "https://www.robots.ox.ac.uk/~vgg/data/pets/data/images.tar.gz"
      annotations: "https://www.robots.ox.ac.uk/~vgg/data/pets/data/annotations.tar.gz"
  fs2k:
    val_split_ratio: 0.15  # 15% stratified carveout from official train
    stratify_field: "style"  # styles: 0, 1, 2
    split_seed: 42
    target_size: [256, 256]

# Corruption Pipeline Parameters
corruptions:
  classes:
    0: "clean"
    1: "salt_and_pepper"
    2: "gaussian_blur"
    3: "rectangular_occlusion"
  training:
    salt_and_pepper:
      prob_min: 0.02
      prob_max: 0.15
    gaussian_blur:
      kernel_sizes: [3, 5, 7]
      sigma_min: 0.5
      sigma_max: 2.5
    rectangular_occlusion:
      num_rect_min: 1
      num_rect_max: 3
      coverage_min: 0.10
      coverage_max: 0.35
  validation:
    seed: 42
  test_fixed_tiers:
    salt_and_pepper:
      - 0.03
      - 0.08
      - 0.15
    gaussian_blur:
      - [3, 0.7]
      - [5, 1.5]
      - [7, 2.5]
    rectangular_occlusion:
      - coverage: 0.10
        num_rects: 1
      - coverage: 0.20
        num_rects: 2
      - coverage: 0.35
        num_rects: 3

# MLflow Experiment Tracking
mlflow:
  tracking_uri: "/content/drive/MyDrive/GenAI-A1/mlruns"
  experiment_names:
    task1: "Task1-Universal-Restoration"
    task2: "Task2-Hard-Routing"
    task3: "Task3-Soft-MoE"
    task4: "Task4-FS2K-Face-to-Sketch"
