services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: genai_restoration_backend
    ports:
      - "8000:8000"
    volumes:
      - ./models_onnx:/app/models_onnx:ro
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
    environment:
      - PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: genai_restoration_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
